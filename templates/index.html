<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreditWise | Loan Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <!-- # Header -->

        <header class="page-header">
            <h1>CreditWise</h1>

            <p>
                AI-Powered Loan Approval Prediction
            </p>
        </header>


        <!-- # Application Form -->

        <form action="/predict" method="POST">

            <!-- # Personal Information -->

            <section class="form-section">

                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Age</label>
                        <input
                            type="number"
                            name="Age"
                            min="18"
                            max="100"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select name="Gender" required>
                            <option value="">Select Gender</option>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Marital Status</label>
                        <select name="Marital_Status" required>
                            <option value="">Select Marital Status</option>
                            <option value="Married">Married</option>
                            <option value="Single">Single</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dependents</label>
                        <input
                            type="number"
                            name="Dependents"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Education Level</label>
                        <select name="Education_Level" required>
                            <option value="">Select Education Level</option>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                </div>

            </section>


            <!-- # Employment Information -->

            <section class="form-section">

                <h2>Employment Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Employment Status</label>
                        <select name="Employment_Status" required>
                            <option value="">Select Employment Status</option>
                            <option value="Contract">Contract</option>
                            <option value="Salaried">Salaried</option>
                            <option value="Self-employed">Self-employed</option>
                            <option value="Unemployed">Unemployed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Employer Category</label>
                        <select name="Employer_Category" required>
                            <option value="">Select Employer Category</option>
                            <option value="Business">Business</option>
                            <option value="Government">Government</option>
                            <option value="MNC">MNC</option>
                            <option value="Private">Private</option>
                            <option value="Unemployed">Unemployed</option>
                        </select>
                    </div>

                </div>

            </section>


            <!-- # Financial Information -->

            <section class="form-section">

                <h2>Financial Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Applicant Income</label>
                        <input
                            type="number"
                            name="Applicant_Income"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Coapplicant Income</label>
                        <input
                            type="number"
                            name="Coapplicant_Income"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Savings</label>
                        <input
                            type="number"
                            name="Savings"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Existing Loans</label>
                        <input
                            type="number"
                            name="Existing_Loans"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Credit Score</label>
                        <input
                            type="number"
                            name="Credit_Score"
                            min="300"
                            max="900"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>DTI Ratio</label>
                        <input
                            type="number"
                            name="DTI_Ratio"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            required
                        >
                    </div>

                </div>

            </section>


            <!-- # Loan Information -->

            <section class="form-section">

                <h2>Loan Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Loan Amount</label>
                        <input
                            type="number"
                            name="Loan_Amount"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Loan Term</label>
                        <input
                            type="number"
                            name="Loan_Term"
                            min="1"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Loan Purpose</label>
                        <select name="Loan_Purpose" required>
                            <option value="">Select Loan Purpose</option>
                            <option value="Business">Business</option>
                            <option value="Car">Car</option>
                            <option value="Education">Education</option>
                            <option value="Home">Home</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Property Area</label>
                        <select name="Property_Area" required>
                            <option value="">Select Property Area</option>
                            <option value="Rural">Rural</option>
                            <option value="Semiurban">Semiurban</option>
                            <option value="Urban">Urban</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Collateral Value</label>
                        <input
                            type="number"
                            name="Collateral_Value"
                            min="0"
                            step="1"
                            inputmode="numeric"
                            required
                        >
                    </div>

                </div>

            </section>


            <!-- # Submit -->

            <div class="button-container">

                <button type="submit">
                    Predict Loan Approval
                </button>

            </div>

        </form>

    </div>

</body>
</html>
